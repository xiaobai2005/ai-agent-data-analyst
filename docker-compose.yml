# ============ 一键容器编排：后端 + 前端 ============
# 使用：
#   1) cp .env.example .env 并填入 API Key
#   2) docker compose up -d --build
#   3) 打开 http://localhost:8501（前端） / http://localhost:8000/docs（接口文档）

services:
  backend:
    build: .
    container_name: agent-backend
    command: uvicorn api:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - ./charts:/app/charts
      - ./uploads:/app/uploads
      - ./reports:/app/reports
      - ./data:/app/data
    restart: unless-stopped

  frontend:
    build: .
    container_name: agent-frontend
    command: streamlit run app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    environment:
      API_URL: http://backend:8000
    depends_on:
      - backend
    volumes:
      - ./charts:/app/charts
      - ./reports:/app/reports
    restart: unless-stopped
